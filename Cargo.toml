[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.3.0"
edition = "2021"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = false
strip = "debuginfo"
incremental = false

[profile.dev.package.rustfft]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.test]
inherits = "dev"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "symbols"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
