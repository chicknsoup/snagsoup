[package]
name = "snagsoup-media"
version = "0.1.0"
edition = "2024"

[dependencies]
snagsoup-capture = { path = "../snagsoup-capture" }
snagsoup-win-platform = { path = "../snagsoup-win-platform" }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
] }
