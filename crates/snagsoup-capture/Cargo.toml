[package]
name = "snagsoup-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
snagsoup-model = { path = "../snagsoup-model" }
snagsoup-win-platform = { path = "../snagsoup-win-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.58", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
