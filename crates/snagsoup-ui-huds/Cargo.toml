[package]
name = "snagsoup-ui-huds"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6"
snagsoup-media = { path = "../snagsoup-media" }
snagsoup-stitch = { path = "../snagsoup-stitch" }
snagsoup-win-platform = { path = "../snagsoup-win-platform" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
