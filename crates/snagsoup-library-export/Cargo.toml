[package]
name = "snagsoup-library-export"
version.workspace = true
edition.workspace = true

[dependencies]
snagsoup-model = { path = "../snagsoup-model" }
snagsoup-canvas = { path = "../snagsoup-canvas" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
gif = "0.14"
color_quant = "1.1"
pdf-writer = "0.12"
notify = "7"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
thiserror = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
] }
